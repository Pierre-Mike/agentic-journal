name: Align — issue to alignment.md

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  align:
    if: github.event_name != 'issue_comment' || github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive slug from issue title
        id: slug
        run: |
          SLUG=$(echo "${{ github.event.issue.title }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/-/g' \
            | sed 's/-\+/-/g' \
            | sed 's/^-//;s/-$//' \
            | cut -c1-50)
          echo "value=$SLUG" >> $GITHUB_OUTPUT

      - name: Create or reuse branch (idempotent)
        run: |
          BRANCH="auto/${{ github.event.issue.number }}-${{ steps.slug.outputs.value }}"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists on remote — checking out"
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            echo "Creating new branch $BRANCH with seed commit"
            git checkout -b "$BRANCH"
            git commit --allow-empty -m "bootstrap: open PR for issue #${{ github.event.issue.number }}"
            git push -u origin "$BRANCH"
          fi

      - name: Open or reuse draft PR (idempotent)
        run: |
          BRANCH="auto/${{ github.event.issue.number }}-${{ steps.slug.outputs.value }}"
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            echo "PR for $BRANCH already exists — reusing"
          else
            gh pr create \
              --draft \
              --title "auto: issue #${{ github.event.issue.number }} — ${{ github.event.issue.title }}" \
              --body "Closes #${{ github.event.issue.number }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node and install Claude Code CLI
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install @anthropic-ai/claude-code
        run: npm i -g @anthropic-ai/claude-code

      - name: Run aligner (writes alignment mailbox only)
        id: align
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # ALIGNMENT-ONLY phase. Do NOT scaffold the spec here — spec.yml owns that.
          # The aligner writes .agentic/last-alignment.md (the canonical intent mailbox)
          # and a copy at specs/active/<id>-<slug>/alignment.md. spec.yml triggers off
          # the latter on push.
          claude -p \
            --no-resume \
            --max-turns 30 \
            --allowedTools "Bash(git:*),Bash(gh:*),Bash(bun:*),Bash(mkdir:*),Bash(mv:*),Bash(cp:*),Bash(rm:*),Edit,Write,Read,Glob,Grep" \
            "Run the auto-aligner subagent on the following intent and write its output to .agentic/last-alignment.md AND copy it to specs/active/<next-id>-<slug>/alignment.md (allocate a new spec id, kebab-slug from the issue title). DO NOT scaffold proposal.md, design.md, tasks.md, or any gate file — those belong to spec.yml. Stop after the alignment files are written.

          INTENT (issue #$ISSUE_NUMBER):
          $ISSUE_BODY" \
            || true
          if [ -f .agentic/last-alignment.md ]; then
            CONF=$(grep -E '^confidence:' .agentic/last-alignment.md | awk '{print $2}')
          else
            CONF="low"
          fi
          echo "confidence=$CONF" >> $GITHUB_OUTPUT

      - name: Commit alignment.md on high confidence
        if: steps.align.outputs.confidence == 'high'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add specs/active/*/alignment.md .agentic/last-alignment.md || true
          git commit -m "chore: add alignment.md for issue #${{ github.event.issue.number }}" || true
          git push

      - name: Comment on low confidence
        if: steps.align.outputs.confidence != 'high'
        run: |
          if [ ! -f .agentic/last-alignment.md ]; then
            gh issue comment ${{ github.event.issue.number }} \
              --body "Aligner failed to produce a mailbox. See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            exit 0
          fi
          GOAL=$(awk '/^## Goal$/{flag=1; next} /^## /{flag=0} flag' .agentic/last-alignment.md | sed '/^[[:space:]]*$/d')
          QUESTIONS=$(awk '/^## Straightforward Details$/{flag=1; next} /^## /{flag=0} flag' .agentic/last-alignment.md | sed '/^[[:space:]]*$/d')
          BODY=$(cat <<EOF
          **Need clarification before the spec can be scaffolded.** The aligner returned \`confidence: low\` — the intent maps to multiple plausible specs, or names decisions you didn't specify.

          **What I understood (Goal):**
          ${GOAL:-_(aligner did not produce a Goal section)_}

          **Questions to disambiguate:**
          ${QUESTIONS:-_(aligner did not produce questions — re-run align.yml manually)_}

          Reply in this issue with answers; the aligner will re-run on your comment.
          EOF
          )
          gh issue comment ${{ github.event.issue.number }} --body "$BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
