name: Slice Runner

# run-name embeds slice/spec/branch identifiers so the controller can parse
# them from `gh run list --json name` to detect duplicates without needing
# per-run API calls.
run-name: "slice ${{ inputs.slice_id || github.event.client_payload.slice_id }} of ${{ inputs.spec_id || github.event.client_payload.spec_id }} on ${{ inputs.branch || github.event.client_payload.branch }}"

on:
  repository_dispatch:
    types: [slice-ready]
  workflow_dispatch:
    inputs:
      slice_id:
        description: "Slice ID to implement"
        required: true
        type: string
      spec_id:
        description: "Spec ID (slug)"
        required: true
        type: string
      branch:
        description: "Branch to check out and push to"
        required: true
        type: string
      issue_number:
        description: "GitHub issue number for failure escalation"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  # Needed for `gh workflow run controller.yml` in the trigger-controller
  # step. Without it the dispatch returns 403 (Resource not accessible by
  # integration) and the cron has to pick up the slack 2 min later.
  actions: write

concurrency:
  group: ${{ inputs.spec_id || github.event.client_payload.spec_id }}-${{ inputs.slice_id || github.event.client_payload.slice_id }}
  cancel-in-progress: false

jobs:
  implement-slice:
    runs-on: ubuntu-latest
    steps:
      - name: Normalize inputs
        id: norm
        run: |
          SLICE_ID="${{ github.event.client_payload.slice_id || github.event.inputs.slice_id }}"
          SPEC_ID="${{ github.event.client_payload.spec_id || github.event.inputs.spec_id }}"
          BRANCH="${{ github.event.client_payload.branch || github.event.inputs.branch }}"
          ISSUE_NUMBER="${{ github.event.client_payload.issue_number || github.event.inputs.issue_number }}"
          echo "slice_id=${SLICE_ID}" >> "$GITHUB_OUTPUT"
          echo "spec_id=${SPEC_ID}" >> "$GITHUB_OUTPUT"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Pull-rebase before work
        run: |
          BRANCH="${{ github.event.client_payload.branch || github.event.inputs.branch }}"
          git pull --rebase origin "${BRANCH}" || echo "Pre-checkout pull skipped (not yet cloned)"

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.event.client_payload.branch }}
          fetch-depth: 0
          # Use GH_PAT (if defined) so the GREEN-marker push fires the
          # downstream `pull_request:synchronize` event that preview.yml
          # listens to. GITHUB_TOKEN-driven pushes never fire that event
          # (GitHub policy to prevent recursive workflow chains), which
          # was breaking the slice → preview → automerge cascade.
          # Falls back to GITHUB_TOKEN if GH_PAT is not configured —
          # cron-driven controller still moves things forward in that
          # case, just slower.
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install @anthropic-ai/claude-code
        run: npm i -g @anthropic-ai/claude-code

      - name: Install dependencies
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun install --frozen-lockfile

      - name: Run slice self-validation loop
        id: loop
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          SLICE_ID="${{ steps.norm.outputs.slice_id }}"
          SPEC_ID="${{ steps.norm.outputs.spec_id }}"
          BRANCH="${{ steps.norm.outputs.branch }}"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          bun scripts/slice/loop.ts \
            --slice-id "${SLICE_ID}" \
            --spec-id "${SPEC_ID}" \
            --branch "${BRANCH}"
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}

      - name: Upload Claude traces as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-traces-${{ github.run_id }}
          path: .claude/traces/
          retention-days: 7
          if-no-files-found: ignore

      - name: Invoke spec-replanner after GREEN commits
        # Replanner is informational: it inspects tasks.md and may patch
        # the DAG. A failure here must NOT fail the slice (the GREEN
        # commit has already landed and is what the controller cares
        # about). Bumped max-turns from 10 → 30 so it has room to think.
        continue-on-error: true
        run: |
          SLICE_ID="${{ steps.norm.outputs.slice_id }}"
          SPEC_ID="${{ steps.norm.outputs.spec_id }}"
          BRANCH="${{ steps.norm.outputs.branch }}"
          claude -p \
            --no-session-persistence \
            --max-turns 30 \
            --allowedTools "Bash(git:*),Bash(bun:*),Edit,Write,Read,Glob,Grep" \
            <<EOF
          You are the spec-replanner. Slice ${SLICE_ID} of spec ${SPEC_ID} is now GREEN on branch ${BRANCH}. Review tasks.md and update the plan: check which slices are unblocked, update depends_on status, and commit any changes to tasks.md. Be concise — if no replanning is needed, exit immediately.
          EOF
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}

      - name: Trigger controller for instant next-wave dispatch
        if: success()
        run: gh workflow run controller.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Failure escalation — post menu on issue
        if: failure()
        run: |
          ISSUE_NUMBER="${{ steps.norm.outputs.issue_number }}"
          SLICE_ID="${{ steps.norm.outputs.slice_id }}"
          SPEC_ID="${{ steps.norm.outputs.spec_id }}"
          if [ -z "${ISSUE_NUMBER}" ]; then
            echo "No issue_number provided; skipping gh issue comment"
            exit 0
          fi
          MENU=$(bun scripts/issue-options.ts "${SPEC_ID}" "${SLICE_ID}" 2>/dev/null || true)
          if [ -z "${MENU}" ]; then
            MENU="Slice ${SLICE_ID} of spec \`${SPEC_ID}\` failed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          gh issue comment "${ISSUE_NUMBER}" --body "${MENU}"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
